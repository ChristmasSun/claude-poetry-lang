version: '3.8'

services:
  # Lament Registry Server
  registry:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lament-registry
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://lament:lament@postgres:5432/lament_registry
      - STORAGE_BACKEND=filesystem
      - STORAGE_PATH=/app/storage
      - REQUIRE_AUTHENTICATION=true
      - ENABLE_RATE_LIMITING=true
      - LOG_LEVEL=INFO
    volumes:
      - registry-storage:/app/storage
      - registry-data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - lament-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lament-postgres
    environment:
      - POSTGRES_USER=lament
      - POSTGRES_PASSWORD=lament
      - POSTGRES_DB=lament_registry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lament-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lament"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lament-redis
    volumes:
      - redis-data:/data
    networks:
      - lament-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lament-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - registry
    networks:
      - lament-network
    restart: unless-stopped

  # Elasticsearch (Optional - for advanced search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: lament-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - lament-network
    restart: unless-stopped
    profiles:
      - search

volumes:
  registry-storage:
    driver: local
  registry-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-cache:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  lament-network:
    driver: bridge
